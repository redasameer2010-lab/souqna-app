name: Build Souqna APK 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o souqna_app_wordpress_api_v1.2.0.zip -d app
          find app -maxdepth 2 -name pubspec.yaml -print

      - name: Detect project directory
        id: project
        run: |
          PROJECT=$(dirname "$(find app -name pubspec.yaml -print -quit)")
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souqna-release-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
